<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create ticket preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css"><script src="assets/js/app.js" defer></script></head>
<body class="ticket-form-page"><header class="app-header"><div class="app-header-title"><h1>Create ticket</h1><p class="app-header-date">Saturday, August 29, 2026</p></div><div class="app-header-actions"><div class="app-header-account"><span class="app-header-avatar">A</span><span><strong>Alex</strong><small>Support team</small></span></div></div></header>
<aside class="topbar"><div class="brand"><img class="strata-logo" src="assets/stratastaff-logo.png" alt="Strata Staff Global"><span class="brand-divider"></span><img class="jamesons-logo" src="assets/jamesons-logo.svg" alt="Jamesons"></div><nav class="nav"><p class="nav-label">Workspace</p><a class="nav-link" href="dashboard-preview.html">Dashboard</a><a class="nav-link active" href="tickets-preview.html">Tickets</a><a class="nav-link" href="my-work-preview.html">My Work</a><a class="nav-link" href="departments-preview.html">Departments</a><a class="nav-link" href="team-calendar-preview.html">Team Calendar</a><a class="nav-link" href="team-attendance-preview.html">Team Attendance</a><a class="nav-link" href="leave-requests-preview.html">Leave Requests</a><a class="nav-link" href="notifications-preview.html">Notifications</a><a class="nav-link" href="roles-access-preview.html">Roles &amp; Access</a></nav><div class="sidebar-footer"><span class="account">Alex</span><a href="#">Sign out</a></div></aside>
<main class="page"><div class="content-shell"><div class="record-form-screen"><form class="record-form-panel"><div class="record-form-head"><div><h2>Ticket details</h2><p>Record the issue, routing, and responsible team.</p></div><span>Required fields</span></div><div class="record-form-grid"><label>Issue escalator<input required placeholder="Who raised this issue?"></label><label>Employee<input required placeholder="Affected employee"></label><label class="is-wide">Subject<input required placeholder="Brief, specific ticket title"></label><label>Priority<select data-ui-select><option>Normal</option><option>High</option><option>Urgent</option></select></label><label>Category<select data-ui-select><option>Select category</option><option selected>Account access</option><option>Payroll</option></select></label><label>Subcategory<select data-ui-select><option selected>Password reset</option><option>Permission issue</option></select></label><label>Current department<select data-ui-select><option selected>Customer Care</option><option>Compliance</option></select></label><label>Departments involved<select multiple data-ui-select data-ui-placeholder="Select departments"><option selected>Customer Care</option><option>Compliance</option><option>Administration</option></select></label><label>Assignees<select multiple data-ui-select data-ui-placeholder="Select assignees"><option selected>James Santos</option><option>Sheena Magdaraog</option></select></label><label class="is-wide">Description<textarea rows="6" placeholder="Describe what happened, the impact, and any useful context."></textarea></label></div><div class="record-form-actions"><a class="button button-secondary" href="tickets-preview.html">Cancel</a><button class="button" type="button">Create ticket</button></div></form></div></div></main></body></html>
